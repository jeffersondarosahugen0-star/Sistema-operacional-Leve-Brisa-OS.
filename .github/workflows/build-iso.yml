name: Compilar ISO e publicar site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    environment:
      name: github-pages
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Dependencias basicas
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Ajustar permissoes dos scripts
        run: chmod +x build.sh auto/* scripts/*.sh scripts/*.py config/hooks/live/* || true

      - name: Compilar ISO
        run: bash ./build.sh

      - name: Mostrar erro da compilacao
        if: failure()
        run: tail -n 150 build.log || echo "build.log nao existe"

      - name: Verificar ISO e limite de 1,2 GB
        run: |
          test -s brisa-os-0.1-amd64.iso || { echo "ISO nao encontrada"; exit 1; }
          SIZE=$(stat -c%s brisa-os-0.1-amd64.iso)
          echo "Tamanho: $((SIZE/1048576)) MiB"
          [ "$SIZE" -le 1258291200 ] || { echo "ISO acima de 1,2 GB"; exit 1; }
          sha256sum -c brisa-os-0.1-amd64.iso.sha256

      - name: Teste de boot BIOS no QEMU
        id: boot
        continue-on-error: true
        run: |
          apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils socat python3
          bash scripts/boot-test.sh brisa-os-0.1-amd64.iso

      - name: Resumo da compilacao
        if: always()
        env:
          BOOT_RESULT: ${{ steps.boot.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          SIZE=$(stat -c%s brisa-os-0.1-amd64.iso 2>/dev/null || echo 0)
          [ -f build-info.txt ] || echo "Brisa OS 0.1" > build-info.txt
          echo "" >> build-info.txt
          echo "Teste de boot automatico (QEMU, BIOS legado): $BOOT_RESULT" >> build-info.txt
          {
            echo "## Resultado"
            echo "Tamanho: $((SIZE/1048576)) MiB"
            echo "Teste de boot BIOS (QEMU): $BOOT_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Enviar logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-e-telas
          path: |
            build.log
            pacotes-maiores.txt
            build-info.txt
            bootlog/*.png
            bootlog/qemu.log
          if-no-files-found: ignore

      - name: Publicar ISO na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Brisa OS 0.1 (build ${{ github.run_number }})
          body_path: build-info.txt
          target_commitish: ${{ github.sha }}
          files: |
            brisa-os-0.1-amd64.iso
            brisa-os-0.1-amd64.iso.sha256

      - name: Gerar site com o link real da ISO
        env:
          BOOT_RESULT: ${{ steps.boot.outcome }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p site/assets
          if [ -f bootlog/screenshot.png ]; then cp bootlog/screenshot.png site/assets/screenshot.png; fi
          BOOTED=false
          if [ "$BOOT_RESULT" = "success" ]; then BOOTED=true; fi
          SHA=$(cut -d' ' -f1 brisa-os-0.1-amd64.iso.sha256)
          SIZE=$(( $(stat -c%s brisa-os-0.1-amd64.iso) / 1048576 ))
          bash scripts/make-site-config.sh "$REPO" "build-$RUN_NUMBER" "$SHA" "$SIZE" "$BOOTED"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
